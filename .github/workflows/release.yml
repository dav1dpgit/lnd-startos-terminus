name: Release

# Builds the .s9pk for x86_64 and aarch64 (Start9's shared build workflow) and publishes them, with their SHA-256
# fingerprints, as a GitHub release named after the package version. Runs on every push to main, and by hand.
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths-ignore: ['*.md']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: '*.s9pk'
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/^ *version: '\([^']*\)'.*/\1/p" startos/versions/current.ts | head -1)
          [ -n "$version" ] || { echo "no version in startos/versions/current.ts"; exit 1; }
          tag="v$(printf '%s' "$version" | tr ':' '_')"
          cd dist
          ls -la
          sha256sum *.s9pk > SHA256SUMS
          cat SHA256SUMS
          {
            echo "Package version \`$version\`."
            echo
            echo "- Intel/AMD servers: the \`x86_64\` file. ARM servers: the \`aarch64\` file."
            echo "- Check your file against \`SHA256SUMS\` before installing (README)."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > ../notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" *.s9pk SHA256SUMS --clobber
            gh release edit "$tag" --notes-file ../notes.md
          else
            gh release create "$tag" *.s9pk SHA256SUMS --target "$GITHUB_SHA" --title "$version" --notes-file ../notes.md
          fi
